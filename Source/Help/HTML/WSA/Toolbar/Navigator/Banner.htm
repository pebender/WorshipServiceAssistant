<h1>Banner Page</h1>

<p>
The 'Banner' page of the
<a href="/HTML/WSA/Toolbar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>
allows you to control the banner.
</p>

<p>
The 'Banner' page contains four frames:
</p>
<ul>
<li>
  the
  <a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerConfiguration.htm"
     title="Get help on the Banner Configuration frame">'Banner Configuration' frame</a>, and
</li>
<li>
  the
  <a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerShow.htm"
     title="Get help on the Banner Show frame">'Banner Show' frame</a>, and
</li>
<li>
  the
  <a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerColor.htm"
     title="Get help on the Banner Color frame">'Banner Color' frame</a>.
</li>
<li>
  the
  <a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerSelection.htm"
     title="Get help on the Banner Selection frame">'Banner Selection' frame</a>.
</li>
</ul>

</body>
