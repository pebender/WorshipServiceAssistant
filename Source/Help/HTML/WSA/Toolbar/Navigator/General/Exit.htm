<h1>Exit Button</h1>
<p>
Clicking the 'Exit' button in the
<a href="/HTML/WSA/Toolbar/Navigator/General.htm"
   title="Get help on the General frame">'General' frame</a>
exits the
<a href="/HTML/WSA/Toolbar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>.
The ESCAPE key has the same effect as the 'Exit' button.
</p>
