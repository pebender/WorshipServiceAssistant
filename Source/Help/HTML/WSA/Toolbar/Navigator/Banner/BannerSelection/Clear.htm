<h1>Clear Button</h1>

<p>
Clicking the 'Clear' button in the
<a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerSelection.htm"
   title="Get help on the Banner Selection frame">'Banner Selection' frame</a>
clears the
<a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerSelection/Text.htm"
   title="Get help on the Text display">banner text</a>.
The DELETE key has the same effect as the 'Clear' button.
</p>

<p>
The 'Clear' button is designed to be used during the worship service. Simply click the 'Clear' button or use the DELETE key.
</p>
