<h1>Banner Show Frame</h1>

<p>
The 'Banner Show' frame on the
<a href="/HTML/WSA/Toolbar/Navigator/Banner.htm"
   title="Get help on the Banner page">'Banner' page</a>
of the
<a href="/HTML/WSA/Toolbar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>
allows you to control the banner.
The 'Banner Show' frame is disabled if the banner is disabled.
You can enable the banner using the
<a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerConfiguration/BannerDisable.htm"
   title="Get help on the Banner Disable/Enable button">'Banner Disable/Enable' button</a>
in the
<a href="/HTML/WSA/Toolbar/Navigator/Banner/BannerConfiguration.htm"
   title="Get help on the Banner Configuration frame">'Banner Configuration' frame</a>.
</p>
