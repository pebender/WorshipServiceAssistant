<h1>General Frame</h1>

<p>
The 'General' frame in the
<a href="/HTML/WSA/CommandBar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>
provides access to general functions.
</p>

<p>
You can use the
<a href="/HTML/WSA/CommandBar/Navigator/General/NextPage.htm"
   title="Get help on the Next Page button">'Next Page' button</a>
to move to the next
<a href="/HTML/WSA/CommandBar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>
page.
</p>

<p>
You can use the
<a href="/HTML/WSA/CommandBar/Navigator/General/Exit.htm"
   title="Get help on the Exit button">'Exit' button</a>
to exit the
<a href="/HTML/WSA/CommandBar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>.
</p>

<p>
You can use the
<a href="/HTML/WSA/CommandBar/Navigator/General/Help.htm"
   title="Get help on the Help button">'Help' button</a>
to get help on the
<a href="/HTML/WSA/CommandBar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>.
</p>

</body>

</html>
