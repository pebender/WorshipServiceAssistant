<h1>Next Page Button</h1>
<p>
Clicking the 'Next Page' button in the
<a href="/HTML/WSA/CommandBar/Navigator/General.htm"
   title="Get help on the General frame">'General' frame</a>
switches the
<a href="/HTML/WSA/CommandBar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>
to the next
<a href="/HTML/WSA/CommandBar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>
page.
The TAB key has the same effect as the 'Next Page' button.
</p>
</body>
