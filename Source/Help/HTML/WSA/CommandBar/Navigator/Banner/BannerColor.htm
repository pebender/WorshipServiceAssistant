<h1>Banner Color Frame</h1>

<p>
The 'Banner Color' frame on the
<a href="/HTML/WSA/CommandBar/Navigator/Banner.htm"
   title="Get help on the Banner page">'Banner' page</a>
of the
<a href="/HTML/WSA/CommandBar/Navigator.htm"
   title="Get help on the Navigator">Navigator</a>
allows you select a color for the banner.
</p>

<p>
You can change the select banner color using the
<a href="BannerColor/Prev.htm"
   title="Get help on the Prev button">'Prev' button</a>
and the
<a href="BannerColor/Next.htm"
   title="Get help on the Next button">'Next' button</a>.
</p>

<p>
You can view the name of the selected banner color in the
<a href="BannerColor/Name.htm"
   title="Get help on the Name display">'Name' display</a>.
</p>

</body>
