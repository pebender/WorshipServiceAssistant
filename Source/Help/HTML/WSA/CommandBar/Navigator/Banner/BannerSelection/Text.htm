<h1>Text Display</h1>

<p>
The 'Text' display in the
<a href="/HTML/WSA/CommandBar/Navigator/Banner/BannerSelection.htm"
   title="Get help on the Banner Selection frame">'Banner Selection' frame</a>
shows the text that will be displayed in the banner if
<a href="/HTML/WSA/CommandBar/Navigator/Banner/BannerShow/Load.htm"
   title="Get help on the Load button">'Load' button</a>
in the
<a href="/HTML/WSA/CommandBar/Navigator/Banner/BannerShow.htm"
   title="Get help on the Banner Show frame">'Banner Show' frame</a>
is clicked.
</p>
